name: Chapter 13 - Native architecture verification
on:
  push:
    paths:
      - 'labs/13-cross-compilation-toolchains-architectures-abis/**'
      - '.github/workflows/chapter13-build.yml'
  pull_request:
    paths:
      - 'labs/13-cross-compilation-toolchains-architectures-abis/**'
      - '.github/workflows/chapter13-build.yml'
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-debug
          - os: ubuntu-latest
            preset: linux-release
          - os: windows-latest
            preset: windows-msvc-debug
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: labs/13-cross-compilation-toolchains-architectures-abis/solution
    steps:
      - uses: actions/checkout@v4
      - name: Initialize MSVC x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

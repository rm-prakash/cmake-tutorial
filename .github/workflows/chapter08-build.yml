name: Chapter 08 static and shared libraries
on:
  push:
    paths:
      - 'labs/08-static-shared-libraries-binary-compatibility/**'
      - '.github/workflows/chapter08-build.yml'
  pull_request:
    paths:
      - 'labs/08-static-shared-libraries-binary-compatibility/**'
      - '.github/workflows/chapter08-build.yml'
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        kind: [STATIC, SHARED]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: labs/08-static-shared-libraries-binary-compatibility/solution
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: cmake -S . -B build/ci -DBUILD_SHARED_LIBS=${{ matrix.kind == 'SHARED' && 'ON' || 'OFF' }} -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        shell: bash
        run: cmake --build build/ci --config Debug --parallel
      - name: Test
        shell: bash
        run: ctest --test-dir build/ci -C Debug --output-on-failure
